name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sanitize: address,undefined
          - os: macos-latest
            sanitize: address

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Configure (debug + tests)
        run: meson setup build --buildtype=debug -Dbuild_tests=true -Db_sanitize=${{ matrix.sanitize }}

      - name: Build
        run: meson compile -C build

      - name: Install smoke test
        run: |
          rm -rf stage
          meson install -C build --destdir "$PWD/stage"
          if [ -d "$PWD/stage/usr/local/lib/pkgconfig" ]; then
            export PKG_CONFIG_LIBDIR="$PWD/stage/usr/local/lib/pkgconfig"
          else
            set -- "$PWD"/stage/usr/local/lib/*/pkgconfig
            export PKG_CONFIG_LIBDIR="$1"
          fi
          export PKG_CONFIG_SYSROOT_DIR="$PWD/stage"
          cc tests/test_installed_consumer.c \
             $(pkg-config --cflags debounce) \
             -o stage/test_installed_consumer
          ./stage/test_installed_consumer

      - name: Test
        run: meson test -C build --verbose

  tsan:
    name: ThreadSanitizer (concurrency, c11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      # -Dtsan=true builds the concurrency test under ThreadSanitizer; the
      # default atomicity_mode=c11 must be race-free (TSAN-clean) here.
      # TSAN is incompatible with ASan, so this is a separate job with no
      # global -Db_sanitize.
      - name: Configure (debug + tests + tsan)
        run: meson setup build-tsan --buildtype=debug -Dbuild_tests=true -Dtsan=true

      - name: Build
        run: meson compile -C build-tsan

      - name: Test (ThreadSanitizer)
        run: meson test -C build-tsan --verbose --print-errorlogs

  volatile-build:
    name: Volatile mode (single-core path)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      # Guard the single-core/MCU path: the header must build and the tests
      # must pass with volatile-qualified state. (The TI C2000 toolchain
      # itself is not available on CI; this catches host-visible regressions
      # in the volatile mode.)
      - name: Configure (volatile + tests)
        run: meson setup build-vol --buildtype=debug -Dbuild_tests=true -Datomicity_mode=volatile

      - name: Build
        run: meson compile -C build-vol

      - name: Test
        run: meson test -C build-vol --verbose --print-errorlogs

  # ---------------------------------------------------------------------------
  # Code coverage gate. Builds with gcov instrumentation, runs the full test
  # suite, and fails the job if line or branch coverage of the header drops
  # below the threshold. Threshold is 100% to match the baseline; lower it
  # deliberately if a justified gap is introduced. Callbacks are enabled so
  # the optional callback paths are measured.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson, Ninja and gcovr
        run: python -m pip install --upgrade meson ninja gcovr

      - name: Configure (coverage)
        run: >
          meson setup build-cov
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true
          -Denable_callbacks=true

      - name: Build
        run: meson compile -C build-cov

      - name: Run tests
        run: meson test -C build-cov --verbose

      - name: Coverage report + gate
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 80 \
            --fail-under-branch 70

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and Ninja
        run: python -m pip install --upgrade meson ninja

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build
